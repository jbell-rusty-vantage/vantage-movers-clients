name: Vercel Preview (Main Site)

on:
  pull_request:
    paths:
      - apps/main-site/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/vercel-movers-main-site-preview.yml
  push:
    branches-ignore:
      - main
    paths:
      - apps/main-site/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/vercel-movers-main-site-preview.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-main-site-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MOVERS_MAIN_SITE }}
  VERCEL_GIT_PROVIDER: github
  VERCEL_GIT_REPO_SLUG: ${{ github.event.repository.name }}
  VERCEL_GIT_REPO_OWNER: ${{ github.repository_owner }}
  VERCEL_GIT_COMMIT_REF: ${{ github.head_ref || github.ref_name }}
  VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
  VERCEL_GIT_COMMIT_AUTHOR_LOGIN: ${{ github.actor }}
  VERCEL_GIT_PULL_REQUEST_ID: ${{ github.event.pull_request.number || '' }}

jobs:
  deploy:
    name: Build and deploy main-site preview
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.13.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck --filter=@vantage/main-site

      - name: Pull Vercel preview environment
        run: >-
          vercel pull
          --yes
          --environment=preview
          --git-branch="$VERCEL_GIT_COMMIT_REF"
          --token="$VERCEL_TOKEN"

      - name: Apply monorepo root directory for Vercel CLI
        run: |
          node -e '
          const fs = require("fs");
          const file = ".vercel/project.json";
          const project = JSON.parse(fs.readFileSync(file, "utf8"));
          project.settings = {
            ...(project.settings ?? {}),
            rootDirectory: "apps/main-site",
            framework: "nextjs",
          };
          fs.writeFileSync(file, JSON.stringify(project, null, 2));
          '

      - name: Verify main-site build API access
        run: node apps/main-site/scripts/verify-build-api.mjs
        env:
          VANTAGE_API_SECRET: ${{ secrets.VANTAGE_API_SECRET }}

      - name: Build prebuilt output
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VANTAGE_API_SECRET: ${{ secrets.VANTAGE_API_SECRET }}

      - name: Deploy prebuilt preview
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Main site preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
